name: codeconnects

services:
  db:
    image: mysql:8.0
    container_name: codeconnects-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-codeconnects_pass}
      MYSQL_DATABASE: ${DB_NAME:-codeconnects}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-codeconnects_pass}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Internal only — uncomment `ports` to inspect DB from host tools (Workbench, etc.)
    # ports:
    #   - "3306:3306"

  server:
    build: ./server
    container_name: codeconnects-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-codeconnects_pass}
      DB_NAME: ${DB_NAME:-codeconnects}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PORT: 5000
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "5000:5000"

  client:
    build: ./client
    container_name: codeconnects-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:80"
    # Frontend calls relative /api/... which nginx proxies to `server:5000`,
    # so no build-time API URL is needed.

volumes:
  db_data:
